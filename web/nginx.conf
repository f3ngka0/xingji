map $uri $safe_uri {
    ~^/trip/[^/]+$ /trip/[redacted];
    ~^/api/v1/public/trips/[^/]+(/positions)?$ /api/v1/public/trips/[redacted];
    default $uri;
}

log_format privacy '$remote_addr $request_method $safe_uri $status $body_bytes_sent';

# This container is internal; Caddy is the public HTTPS entry point.
map $http_x_forwarded_proto $proxy_scheme {
    default $scheme;
    https https;
    http http;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /dev/stdout privacy;
    error_log /dev/stderr warn;
    server_tokens off;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
        proxy_pass http://server:3000/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $proxy_scheme;
    }

    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_scheme;
        proxy_hide_header X-Powered-By;
    }

    location /_AMapService {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_scheme;
        proxy_hide_header X-Powered-By;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
