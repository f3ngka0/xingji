<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>当前位置</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #f2f1ee; }
    #map { width: 100%; height: 100%; }
    .map-error {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 8px; color: #737373;
      font-family: sans-serif; font-size: 14px; text-align: center; padding: 24px;
    }
    .current-dot {
      width: 18px; height: 18px; border-radius: 50%;
      background: #171717; border: 3px solid #ffffff; box-shadow: 0 0 0 1px rgba(0,0,0,0.25);
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var lat = parseFloat(params.get('lat'));
      var lon = parseFloat(params.get('lon'));
      var container = document.getElementById('map');
      if (typeof L === 'undefined') {
        container.innerHTML = '<div class="map-error">地图资源暂时无法加载，请检查网络后重试。</div>';
        return;
      }
      var map = L.map('map', { zoomControl: false, attributionControl: true, preferCanvas: true });
      L.tileLayer('https://{s}.tile.openstreetmap.de/{z}/{x}/{y}.png', {
        maxZoom: 19,
        subdomains: 'abc',
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);
      if (Number.isFinite(lat) && Number.isFinite(lon)) {
        L.marker([lat, lon], {
          icon: L.divIcon({ className: '', html: '<div class="current-dot"></div>', iconSize: [18, 18], iconAnchor: [9, 9] })
        }).addTo(map);
        map.setView([lat, lon], 15);
      } else {
        map.setView([35.8617, 104.1954], 4);
      }
    })();
  </script>
</body>
</html>
